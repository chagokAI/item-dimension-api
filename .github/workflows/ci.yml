name: Dimension CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: dimension-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install pillow==13.0.0 confluent-kafka==2.16.0
      - name: Check Python and deployment behavior
        run: |
          python -m compileall -q app tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          for script in scripts/*.sh; do bash -n "$script"; done
          python -m unittest discover -s scripts/tests -v

  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: chagok-dimension:ci
          cache-from: |
            type=gha,scope=dimension-${{ matrix.arch }}
            type=gha,scope=dimension-release
          cache-to: type=gha,mode=max,scope=dimension-${{ matrix.arch }}
      - name: Check the container with isolated infrastructure
        run: bash scripts/check-container.sh chagok-dimension:ci
